# EAS Workflow for Nella mobile app
# Expo detects workflows in .eas/workflows/ when you connect your GitHub repo.
name: Nella CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    name: Build and submit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Configure EAS
        run: npx eas-cli@latest --version

      - name: Build iOS
        run: npx eas-cli@latest build --platform ios --profile development --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
