# EAS Workflow for Nella mobile app
# Expo detects workflows in .eas/workflows/ when you connect your GitHub repo.
name: Nella CI

on:
  workflow_dispatch:
  push:
    branches: [main, expo-migration]

jobs:
  build:
    name: Build and submit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        working-directory: ./expo-native

      - name: Configure EAS
        run: npx eas-cli@latest --version

      - name: Build Android
        run: npx eas-cli@latest build --platform android --profile development --non-interactive --auto-submit
        working-directory: ./expo-native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
