name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build the server bundle
        run: bun run build

      - name: Build the app bundle (prerendered SPA)
        run: bun run build:app

      - name: Check the app bundle
        run: |
          test -f dist/index.html
          test -f dist/auth/index.html
          test -f dist/chat/index.html
          test -d dist/assets
          echo "App bundle contents:"
          find dist -maxdepth 2 -name '*.html' | sort
