name: Android

# Builds the Android app bundle and uploads it to Google Play.
#
# Required repository secrets (see docs/store-release.md):
#   ANDROID_KEYSTORE_BASE64 — the upload key, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — the Play Console service account key, base64 encoded

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Google Play"
        type: boolean
        default: true
  push:
    tags:
      - "android-v*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the app bundle
        run: bun run build:app

      - name: Sync the native project
        run: bunx cap sync android

      - name: Decode the upload key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/nella-upload.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build the AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.storeFile="$GITHUB_WORKSPACE/android/app/nella-upload.jks" \
            -Pandroid.injected.signing.storePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.keyAlias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.keyPassword="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Save the AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nella-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload to Google Play
        if: ${{ inputs.upload != false }}
        uses: r0adkll/upload-google-play@v1
        with:
          service_account_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package_name: creative.lantid.nella
          file: android/app/build/outputs/bundle/release/*.aab
          release_name: ${{ github.sha }}
          skip_tests: true
          skip_metadata: true
          skip_changelogs: true
          status: completed
